[project]
name = "xau-sniper-bot"
version = "0.1.0"
description = "Multi-timeframe MT5 scanner for XAUUSD sniper setups with gated OpenAI validation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "MetaTrader5>=5.0.45",
  "numpy>=1.24",
  "openai>=1.99.0",
  "pandas>=2.0",
]

[project.scripts]
xau-sniper-bot = "xau_sniper_bot.bot:main"

[tool.ruff]
line-length = 100
target-version = "py310"

